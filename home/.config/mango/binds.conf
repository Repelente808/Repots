# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# menu and apps
bindr=Super,Super_L,spawn_shell,(pkill rofi && pw-play --volume=0.2 ~/.config/swaync/roficlose.wav) || (pw-play --volume=0.2 ~/.config/swaync/rofiopen.wav & rofi -show drun -show-icons)
bind=SUPER,T,spawn,kitty
bind=SUPER,C,spawn,vscodium
bind=SUPER,E,spawn,thunar

# exit
bind=SUPER,q,killclient,

# switch window focus
bind=SUPER,Tab,toggleoverview
# move window
bind=SUPER,Up,move_client,up
bind=SUPER,Down,move_client,down
bind=SUPER,Left,move_client,left
bind=SUPER,Right,move_client,right
bind=SUPER,space,togglefloating


# tag switch
bind=SUPER+alt,1,tag,1,0
bind=SUPER+alt,2,tag,2,0
bind=SUPER+alt,3,tag,3,0
bind=SUPER+alt,4,tag,4,0
bind=SUPER+alt,5,tag,5,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0

bind=SUPER,f,togglefullscreen
# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize


bind =none,XF86AudioRaiseVolume, spawn_shell, swayosd-client --output-volume raise
bind =none,XF86AudioLowerVolume, spawn_shell, swayosd-client --output-volume lower
bind =none,XF86AudioMute,spawn,swayosd-client --output-volume mute-toggle


bind=SUPER+CTRL,r,spawn,bash ~/.config/waybar/scripts/launch.sh
bind=SUPER,s,spawn_shell,(pkill rofi && pw-play --volume=0.2 ~/.config/swaync/roficlose.wav) || (pw-play --volume=0.2 ~/.config/swaync/rofiopen.wav & ~/.config/rofi/menu.sh)
bind=SUPER+SHIFT,s,spawn,bash -c "grim -g '$(slurp)' - | satty --early-exit --action-on-enter save-to-file --right-click-copy --filename - --copy-command 'wl-copy --type image/png' --output-filename ~/Pictures/screenshots/\$(date '+%y-%d:%m-%H:%M').png"
bind=NONE,Print,spawn_shell,grim -o "$(mmsg get cursorpos | jq -r '.monitor')" - | wl-copy

circle_layout=dwindle,scroller

bind=SUPER,n,switch_layout

bind=SUPER,l,spawn,hyprlock
