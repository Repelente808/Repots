general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl eval "hl.dispatch(hl.dsp.monitor.dpms({ action = 'on' }))"
}

# === MONITOR DIM ===
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# === LOCKSCREEN ===
listener {
    timeout = 1800
    on-timeout = loginctl lock-session
}

# === TURN OFF SCREEN ===
listener {
    timeout = 2100
    on-timeout = hyprctl eval "hl.dispatch(hl.dsp.monitor.dpms({ action = 'off' }))"
    on-resume = hyprctl eval "hl.dispatch(hl.dsp.monitor.dpms({ action = 'on' }))" && brightnessctl -r
}
