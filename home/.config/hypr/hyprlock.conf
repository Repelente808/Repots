source = $HOME/.config/hypr/colors.conf
$Scripts = $HOME/.config/hypr/scripts

general {
    grace = 5
    fractional_scaling = 2
    immediate_render = true
}

# ~/.config/hypr/hyprlock.conf
background {
    monitor =
    path = ~/.config/hypr/hyprlock_assets/current_wallpaper.jpg
    blur_size = 4
    blur_passes = 3 # 0 disables blurring
    noise = 0.0117
    contrast = 1.3000 # Vibrant!!!
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
} 

# Profie-Photo
image {
    monitor =
    path = ~/.config/hypr/hyprlock_assets/me.jpg
    border_size = 6
    border_color = $primary_fixed_dim
    size = 190
    rounding = 150
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, 20
    halign = center
    valign = center
}

# USER
label {
    monitor =
    # text = <i> Hi! $USER ;) </i>
    text = cmd[update:60000] echo "<i> Good $(H=$(date +%H); if [ $H -lt 12 ]; then echo Morning,; elif [ $H -lt 18 ]; then echo Afternoon,; else echo Evening,; fi) $(echo "${USER:0:1}" | tr '[:lower:]' '[:upper:]')$(echo "${USER:1}" | tr '[:upper:]' '[:lower:]') </i>" 
    color = $primary
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 11
    font_family = Google Sans
    position = 0, -335
    shadow_passes = 3
    shadow_size = 4
    halign = center
    valign = center
}
# Hours
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H") </big></b>"
    color = $primary_fixed_dim
    font_size = 112
    font_family = Google Sans
    shadow_passes = 3
    shadow_size = 4

    position = -50, 220
    halign = center
    valign = center
}

# Minutes
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
    color = $tertiary_fixed_dim 
    font_size = 112
    font_family = Google Sans
    shadow_passes = 3
    shadow_size = 4
    position = 60, 180
    halign = center
    valign = center
}

# Today
label {
    monitor =
    text = cmd[update:18000000] echo "<b><big> "$(date +'%A')" </big></b>"
    color = $secondary
    font_size = 18
    font_family = Google Sans
    shadow_passes = 3
    shadow_size = 4

    position = 0, -120
    halign = center
    valign = center
}

# Week
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%d %b')" </b>"
    color = $secondary
    font_size = 14
    font_family = Google Sans
    shadow_passes = 3
    shadow_size = 4

    position = 0, -100
    halign = center
    valign = center
}

# mpris
label {
    monitor =
    text = cmd[update:1000] echo "󰎆  $(playerctl metadata artist) - $(playerctl metadata title)"
    color = $tertiary
    font_size = 14
    font_family = Google Sans
    shadow_passes = 3
    shadow_size = 4
    position = 0, 80
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3

    dots_size = 0.26 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.64 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rouding = -1
    shadow_passes = 3
    shadow_size = 4

    rounding = 22
    outer_color = $primary
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = $secondary
    fade_on_empty = true
    font_family = Google Sans
    placeholder_text = <i>Password...</i> # Text rendered in the input box when it's empty.

    position = 0, 120
    halign = center
    valign = bottom
}
